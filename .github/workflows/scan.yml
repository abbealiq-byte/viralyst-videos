name: Scan YouTube channels

on:
  push:
    paths:
      - "scans/requests/**"
      - "engine/scan.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional transcript helper
        run: pip install -q youtube-transcript-api || true
      - name: Scan new requests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python engine/scan.py
      - name: Commit results
        run: |
          git config user.name "Viralyst Scanner"
          git config user.email "viralyst@users.noreply.github.com"
          git add scans/results
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Scan results [skip ci]"
            git pull --rebase
            git push
          fi
