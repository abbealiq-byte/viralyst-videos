name: Compose 3D video from existing frames

on:
  push:
    paths:
      - "blender/RECOMPOSE"

permissions:
  contents: write
  actions: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read request
        id: req
        run: |
          echo "run_id=$(cut -d' ' -f1 blender/RECOMPOSE)" >> $GITHUB_OUTPUT
          echo "project=$(cut -d' ' -f2 blender/RECOMPOSE)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: parts
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow
          P="${{ steps.req.outputs.project }}"
          mkdir -p frames videos logs && cp parts/*/f_*.png frames/
          ls frames | wc -l > logs/compose_$P.log
          python blender/compose.py "$P" frames "videos/3d_$P.mp4" >> logs/compose_$P.log 2>&1 || echo "FAILED" >> logs/compose_$P.log
      - name: Commit
        run: |
          git config user.name "Viralyst 3D"
          git config user.email "viralyst@users.noreply.github.com"
          git add videos logs
          git commit -m "Compose 3D video [skip ci]" || exit 0
          git pull --rebase && git push
