name: Render Viralyst videos

on:
  push:
    paths:
      - "storyboards/**"
      - "engine/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (ffmpeg, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Cache Kokoro voice model
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download Kokoro voice model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Python packages
        run: pip install -q kokoro-onnx==0.6.1 soundfile pillow numpy

      - name: Render new storyboards
        env:
          KOKORO_DIR: models
        run: python engine/build.py

      - name: Commit rendered videos
        run: |
          git config user.name "Viralyst Engine"
          git config user.email "viralyst@users.noreply.github.com"
          git add videos
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Render videos [skip ci]"
            git pull --rebase
            git push
          fi
