name: Render 3D (Blender)

on:
  push:
    paths:
      - "blender/*.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        chunk: [[1, 48], [49, 96], [97, 144], [145, 192]]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1
      - name: Install Blender (bpy)
        run: pip install -q "bpy==4.2.*"
      - name: Render frames
        run: python blender/poc_robot.py frames 540 960 8 ${{ matrix.chunk[0] }} ${{ matrix.chunk[1] }}
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk[0] }}
          path: frames/

  combine:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Encode video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p frames blender/out && cp parts/*/f_*.png frames/
          ls frames | wc -l
          ffmpeg -y -loglevel error -framerate 24 -i frames/f_%04d.png -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -c:v libx264 -crf 18 -preset slow -movflags +faststart blender/out/poc_robot.mp4
      - name: Commit
        run: |
          git config user.name "Viralyst 3D"
          git config user.email "viralyst@users.noreply.github.com"
          git add blender/out
          git commit -m "3D proof of concept render [skip ci]" || exit 0
          git pull --rebase && git push
